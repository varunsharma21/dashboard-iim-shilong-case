<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROOTS Hub | Teacher Intervention Dashboard</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ivory: '#F5F0E5', forest: '#234638', sage: '#DDE8DB', gold: '#D7B77A' },
  fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'] } } } };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { background: #F5F0E5; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: #234638; overflow-x: hidden; }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.35); } 70% { box-shadow: 0 0 0 10px rgba(220,38,38,0); } 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); } }
  @keyframes flash { 0%,100% { box-shadow: 0 0 0 0 rgba(215,183,122,0); } 40% { box-shadow: 0 0 0 6px rgba(215,183,122,.9); } }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .pulse-ring { animation: pulseRing 2s infinite; }
  .flash { animation: flash 1.2s ease-out 2; }
  .slide-in { animation: slideIn .22s ease-out; }
  .toast-in { animation: toastIn .2s ease-out; }
  @media (prefers-reduced-motion: reduce) { .pulse-ring, .flash, .slide-in, .toast-in { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Icon({ name, size = 18, className = '' }) {
  const data = window.lucide && window.lucide.icons && window.lucide.icons[name];
  if (!data) return <span style={{ width: size, height: size }} className="inline-block" />;
  const nodes = data[0] === 'svg' ? data[2] : data;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={'shrink-0 ' + className} aria-hidden="true">
      {nodes.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
    </svg>
  );
}

const STAGES = ["Concept Intro", "Local Analogy", "Apply It", "Peer Teaching"];
const ST = {
  verified:    { label: "Verified",    icon: "CircleCheck",   cls: "bg-emerald-50 text-emerald-700 ring-emerald-200" },
  progressing: { label: "Progressing", icon: "TrendingUp",    cls: "bg-sage text-forest ring-forest/20" },
  stuck:       { label: "Stuck",       icon: "TriangleAlert", cls: "bg-red-50 text-red-700 ring-red-200" },
  working:     { label: "Working",     icon: "Pencil",        cls: "bg-gray-100 text-gray-700 ring-gray-300" },
};
const FILTERS = [["all", "All"], ["stuck", "Needs attention"], ["working", "Working"], ["progressing", "Progressing"], ["verified", "Verified"]];
const CHIPS = ["Think about Earth’s tilt", "Why is it winter in Australia in July?", "Use the torch and globe again", "Try a local example from your village"];
const LOGKIND = { teacher: "bg-gold/30 border-gold", system: "bg-gray-50 border-gray-200", hint: "bg-amber-50 border-amber-200", student: "bg-sage/60 border-forest/10" };
const STUDENT_LINES = ["Typed: the tilt of the Earth matters for the seasons.", "Re-read the concept card together.", "Added a note on summer and winter in our village.", "Compared the globe model with the textbook diagram.", "Drafted an answer to share with the teacher."];

const pick = a => a[Math.floor(Math.random() * a.length)];
const ts = () => new Date().toLocaleTimeString("en-GB");
const ini = n => n.split(" ").map(w => w[0]).join("").slice(0, 2);
const S = (n, r, c) => ({ n, r, c });
const L = (t, w, k, x) => ({ t, w, k, x });

const makeInitial = () => [
  { id: 1, name: "Group 01", stage: 4, status: "verified", mis: null,
    students: [S("Aarav Singh", "Reader", 9), S("Diya Verma", "Recorder", 7), S("Kabir Yadav", "Presenter", 8), S("Meera Patel", "Checker", 6)],
    log: [L("10:21:10", "Aarav", "student", "Seasons happen because Earth’s axis is tilted about 23.5 degrees."), L("10:21:34", "System", "system", "Correct. Moving to Stage 2."),
      L("10:29:02", "Diya", "student", "In our village, mango season is summer, when the sun is high and days are long."), L("10:35:40", "Kabir", "student", "We tested it with a torch and a tilted globe."), L("10:44:15", "System", "system", "Group verified at Stage 4.")] },
  { id: 2, name: "Group 02", stage: 2, status: "progressing", mis: null,
    students: [S("Rohan Kumar", "Reader", 6), S("Sneha Gupta", "Recorder", 8), S("Ishaan Tiwari", "Presenter", 4), S("Pooja Rani", "Checker", 5), S("Aditya Mishra", "Reader", 3)],
    log: [L("10:30:12", "Rohan", "student", "Tilt changes how directly sunlight hits us."), L("10:33:50", "Sneha", "student", "Like wheat sowing in November, when the days get cooler."), L("10:40:05", "System", "system", "Good local analogy. Add one more example.")] },
  { id: 3, name: "Group 03", stage: 2, status: "stuck", mis: "Believes the seasons come from Earth’s distance to the sun. The real cause is the tilt of Earth’s axis.",
    students: [S("Ananya Sharma", "Reader", 5), S("Vihaan Chauhan", "Recorder", 3), S("Riya Kushwaha", "Presenter", 2), S("Dev Pandey", "Checker", 6)],
    log: [L("10:38:05", "Ananya", "student", "We think summer is hot because Earth moves closer to the sun."), L("10:38:20", "System", "system", "Not quite. Check your idea against the globe model."),
      L("10:40:10", "Vihaan", "hint", "Hint 1 requested."), L("10:40:48", "Riya", "hint", "Hint 2 requested."), L("10:41:55", "Dev", "hint", "Hint 3 requested."),
      L("10:42:20", "Dev", "student", "Summer is when distance from the sun is less. We are sure."), L("10:42:24", "System", "system", "Incorrect. Hints are used up for this stage.")] },
  { id: 4, name: "Group 04", stage: 1, status: "working", mis: null,
    students: [S("Kavya Joshi", "Reader", 4), S("Arjun Thakur", "Recorder", 3), S("Nisha Kumari", "Presenter", 2), S("Harsh Dubey", "Checker", 3), S("Simran Kaur", "Reader", 2)],
    log: [L("10:36:10", "Kavya", "student", "We read the concept card on Earth’s orbit."), L("10:37:30", "System", "system", "Stage 1 started: Concept Intro."), L("10:39:45", "Arjun", "student", "Is the Earth tilted all year?")] },
  { id: 5, name: "Group 05", stage: 1, status: "working", mis: null,
    students: [S("Yash Rawat", "Reader", 3), S("Tanvi Bhatt", "Recorder", 4), S("Om Prakash", "Presenter", 1), S("Lakshmi Devi", "Checker", 2)],
    log: [L("10:37:05", "Yash", "student", "Reading the card about changes in day length."), L("10:40:20", "Tanvi", "student", "We are drawing the sun and the Earth.")] },
  { id: 6, name: "Group 06", stage: 1, status: "working", mis: null,
    students: [S("Manav Saini", "Reader", 2), S("Ritu Rani", "Recorder", 3), S("Sahil Khan", "Presenter", 1)],
    log: [L("10:38:00", "Manav", "student", "Starting the concept card now."), L("10:41:10", "Ritu", "hint", "Asked to re-read the hint card.")] },
];

function Badge({ status }) {
  const s = ST[status];
  return <span className={"inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset " + s.cls}><Icon name={s.icon} size={13} />{s.label}</span>;
}
function StageBar({ stage, stuck }) {
  return <div className="flex gap-1.5" role="img" aria-label={`Stage ${stage} of 4`}>{[1, 2, 3, 4].map(n =>
    <div key={n} className={"h-1.5 flex-1 rounded-full " + (n <= stage ? (stuck ? "bg-amber-500" : "bg-forest") : "bg-forest/10")} />)}</div>;
}

function Clock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  return <div className="text-right leading-tight">
    <div className="text-sm font-semibold tabular-nums">{now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</div>
    <div className="text-[11px] text-white/75">{now.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}</div></div>;
}

function Card({ g, flash, onOpen }) {
  const stuck = g.status === "stuck", last = g.log[g.log.length - 1];
  return (
    <article tabIndex={0} role="button" aria-label={`Open ${g.name} details`} onClick={e => onOpen(e.currentTarget)}
      onKeyDown={e => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); onOpen(e.currentTarget); } }}
      className={"relative min-w-0 cursor-pointer rounded-xl bg-white p-5 transition hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-forest focus-visible:ring-offset-2 focus-visible:ring-offset-ivory " +
        (stuck ? "border-2 border-red-500 shadow-lg shadow-red-900/10 pulse-ring " : "border border-forest/10 shadow-sm ") + (flash ? "flash" : "")}>
      {stuck && <div className="absolute inset-x-0 top-0 h-1.5 rounded-t-[10px] bg-gradient-to-r from-amber-400 via-orange-500 to-red-500" />}
      <div className="flex items-start justify-between gap-3">
        <div className="flex min-w-0 items-center gap-3">
          <div className={"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl " + (stuck ? "bg-red-50 text-red-600" : "bg-sage text-forest")}><Icon name="Users" size={20} /></div>
          <div className="min-w-0"><h3 className="text-base font-semibold">{g.name}</h3><p className="text-xs text-forest/75">{g.students.length} students</p></div>
        </div>
        <Badge status={g.status} />
      </div>
      <div className="mt-5">
        <div className="mb-2 flex items-center justify-between text-sm"><span className="font-medium">Stage {g.stage}: {STAGES[g.stage - 1]}</span><span className="text-xs text-forest/75">{g.stage}/4</span></div>
        <StageBar stage={g.stage} stuck={stuck} />
      </div>
      {g.status === "verified" && <div className="mt-4 flex items-center gap-2 rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700"><Icon name="CircleCheck" size={16} />Stage 4 completed</div>}
      {(g.status === "progressing" || g.status === "working") && <div className="mt-4 flex min-w-0 items-center gap-2 text-sm text-forest/75"><Icon name="Clock" size={15} /><span className="truncate">{last.t} · {last.w}: {last.x}</span></div>}
      {stuck && <div className="mt-4 space-y-3">
        <div className="rounded-lg bg-red-600 px-3 py-2.5 text-sm font-semibold text-white shadow-sm">⚠️ STUCK: 3 hints in 2 mins</div>
        <button onClick={e => { e.stopPropagation(); onOpen(e.currentTarget); }} className="flex min-h-[44px] w-full items-center justify-center gap-2 rounded-xl bg-forest px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-forest/90 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold focus-visible:ring-offset-2">Review Attempt <Icon name="ArrowRight" size={16} /></button>
      </div>}
    </article>
  );
}

function Drawer({ g, onClose, onHint, onResolve, onAdvance, onVerify }) {
  const ref = useRef(), logRef = useRef(), closeRef = useRef();
  const [txt, setTxt] = useState("");
  useEffect(() => { closeRef.current && closeRef.current.focus(); }, []);
  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [g.log.length]);
  const trap = e => {
    if (e.key !== "Tab") return;
    const f = [...ref.current.querySelectorAll("button:not([disabled]),input")];
    if (!f.length) return;
    const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  };
  const send = () => { const v = txt.trim(); if (!v) return; onHint(v); setTxt(""); };
  const maxC = Math.max(...g.students.map(s => s.c), 1);
  const btn = "flex min-h-[44px] items-center justify-center gap-2 rounded-xl px-4 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-gold focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50";
  return (
    <div className="fixed inset-0 z-40" onKeyDown={trap}>
      <div className="absolute inset-0 bg-forest/40" onClick={onClose} aria-hidden="true" />
      <div ref={ref} role="dialog" aria-modal="true" aria-label={`${g.name} details`} className="slide-in absolute inset-y-0 right-0 flex w-full flex-col bg-ivory shadow-2xl sm:max-w-md">
        <div className="flex items-start justify-between gap-3 border-b border-forest/10 bg-white px-5 py-4">
          <div><h2 className="text-lg font-semibold">{g.name}</h2>
            <div className="mt-1.5 flex flex-wrap items-center gap-2"><Badge status={g.status} /><span className="text-sm text-forest/75">Stage {g.stage}: {STAGES[g.stage - 1]}</span></div></div>
          <button ref={closeRef} onClick={onClose} aria-label="Close panel" className="flex h-11 w-11 items-center justify-center rounded-xl text-forest hover:bg-sage focus:outline-none focus-visible:ring-2 focus-visible:ring-forest"><Icon name="X" size={20} /></button>
        </div>
        <div className="flex-1 space-y-5 overflow-y-auto px-5 py-5">
          {g.status === "stuck" && <div className="rounded-xl bg-red-600 px-4 py-3 text-sm font-semibold text-white">⚠️ STUCK: 3 hints in 2 mins</div>}
          {g.mis && <div className="rounded-xl border border-amber-300 bg-amber-50 p-4"><div className="mb-1 flex items-center gap-2 text-sm font-semibold text-amber-900"><Icon name="Lightbulb" size={16} />Detected misconception</div><p className="text-sm text-amber-900">{g.mis}</p></div>}
          <section><h3 className="mb-2 text-sm font-semibold uppercase tracking-wide text-forest/75">Students</h3>
            <ul className="space-y-2">{g.students.map(s => <li key={s.n} className="flex items-center gap-3 rounded-xl bg-white p-3 shadow-sm">
              <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-sage text-xs font-bold">{ini(s.n)}</div>
              <div className="min-w-0 flex-1"><div className="flex items-center justify-between gap-2"><span className="truncate text-sm font-medium">{s.n}</span><span className="rounded-full bg-gold/30 px-2 py-0.5 text-xs font-medium">{s.r}</span></div>
                <div className="mt-1.5 flex items-center gap-2"><div className="h-1.5 flex-1 rounded-full bg-forest/10"><div className="h-1.5 rounded-full bg-forest" style={{ width: (s.c / maxC * 100) + "%" }} /></div><span className="w-6 text-right text-xs tabular-nums text-forest/75">{s.c}</span></div></div></li>)}</ul></section>
          <section><h3 className="mb-2 text-sm font-semibold uppercase tracking-wide text-forest/75">Attempt log</h3>
            <ol ref={logRef} className="max-h-72 space-y-2 overflow-y-auto pr-1">{g.log.map((e, i) => <li key={i} className={"rounded-lg border px-3 py-2 text-sm " + LOGKIND[e.k]}>
              <div className="mb-0.5 flex items-center justify-between text-xs text-forest/75"><span className="font-semibold">{e.w}</span><span className="tabular-nums">{e.t}</span></div>{e.x}</li>)}</ol></section>
        </div>
        <div className="space-y-3 border-t border-forest/10 bg-white px-5 py-4">
          <div className="flex flex-wrap gap-2">{CHIPS.map(c => <button key={c} onClick={() => setTxt(c)} className="min-h-[44px] rounded-full border border-forest/20 bg-ivory px-3 text-xs font-medium hover:bg-sage focus:outline-none focus-visible:ring-2 focus-visible:ring-forest sm:min-h-[36px]">{c}</button>)}</div>
          <div className="flex gap-2">
            <input value={txt} onChange={e => setTxt(e.target.value)} onKeyDown={e => { if (e.key === "Enter") send(); }} aria-label="Hint message" placeholder="Type a hint for this group"
              className="min-h-[44px] min-w-0 flex-1 rounded-xl border border-forest/20 bg-white px-3 text-sm focus:outline-none focus:ring-2 focus:ring-forest" />
            <button onClick={send} disabled={!txt.trim()} className={btn + " bg-forest text-white hover:bg-forest/90"}><Icon name="Send" size={16} />Send hint</button>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={onResolve} disabled={g.status === "verified"} className={btn + " border border-forest/25 bg-sage text-forest hover:bg-sage/70"}><Icon name="Check" size={16} />Mark as resolved</button>
            {g.stage === 4 && g.status !== "verified"
              ? <button onClick={onVerify} className={btn + " bg-gold text-forest hover:bg-gold/80"}><Icon name="BadgeCheck" size={16} />Verify</button>
              : <button onClick={onAdvance} disabled={g.stage >= 4} className={btn + " border border-forest/25 bg-white text-forest hover:bg-sage/60"}><Icon name="ChevronsRight" size={16} />Advance stage</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [groups, setGroups] = useState(makeInitial);
  const [filter, setFilter] = useState("all");
  const [q, setQ] = useState("");
  const [openId, setOpenId] = useState(null);
  const [sim, setSim] = useState(true);
  const [toasts, setToasts] = useState([]);
  const [flashId, setFlashId] = useState(null);
  const [pop, setPop] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const gRef = useRef(groups); gRef.current = groups;
  const opener = useRef(null), lastStuck = useRef(Date.now()), tid = useRef(0);

  const toast = (msg, type = "ok") => {
    const id = ++tid.current;
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);
  };
  const patch = (id, fn) => setGroups(gs => gs.map(g => g.id === id ? fn(g) : g));
  const addLog = (g, k, w, x) => ({ ...g, log: [...g.log, { t: ts(), w, k, x }] });
  const nameOf = id => gRef.current.find(g => g.id === id).name;

  const open = (id, el) => { opener.current = el; setOpenId(id); };
  const close = () => { setOpenId(null); setTimeout(() => { const el = opener.current; if (el && el.isConnected) el.focus(); }, 0); };

  const hint = (id, text) => { patch(id, g => ({ ...addLog(g, "teacher", "Teacher", text), status: g.status === "stuck" ? "working" : g.status })); toast(`Hint sent to ${nameOf(id)}`); };
  const resolve = id => { patch(id, g => ({ ...addLog(g, "teacher", "Teacher", "Marked as resolved."), status: "progressing" })); toast(`${nameOf(id)} marked as resolved`); close(); };
  const advance = id => { patch(id, g => g.stage >= 4 ? g : { ...addLog({ ...g, stage: g.stage + 1, status: g.status === "stuck" ? "working" : g.status }, "teacher", "Teacher", `Advanced to Stage ${g.stage + 1}: ${STAGES[g.stage]}.`) }); toast(`${nameOf(id)} advanced a stage`); };
  const verify = id => { patch(id, g => addLog({ ...g, status: "verified" }, "system", "System", "Group verified at Stage 4.")); toast(`${nameOf(id)} verified`); };
  const reset = () => { setGroups(makeInitial()); setOpenId(null); setFilter("all"); setQ(""); lastStuck.current = Date.now(); toast("Demo reset to the starting state"); };
  const clear = () => { setFilter("all"); setQ(""); };
  const doSync = () => { setSyncing(true); setTimeout(() => { setSyncing(false); setPop(false); toast("Sync complete. Everything is up to date."); }, 1800); };

  const tick = () => {
    const gs = gRef.current, t = ts();
    const work = gs.filter(g => g.status === "working"), prog = gs.filter(g => g.status === "progressing" && g.stage < 4), live = gs.filter(g => g.status !== "verified");
    let act;
    if (Date.now() - lastStuck.current > 60000 && work.length) act = "stuck";
    else { const o = ["log", "log"]; if (work.length) o.push("progress"); if (prog.length) o.push("advance"); act = pick(o); }
    if (act === "stuck") {
      const g = pick(work); lastStuck.current = Date.now();
      patch(g.id, x => ({ ...x, status: "stuck", mis: "Mixing up Earth’s rotation (day and night) with its revolution (seasons).", log: [...x.log, { t, w: "System", k: "hint", x: "3 hints requested in 2 minutes." }] }));
      toast(`${g.name} needs help`, "alert"); setFlashId(g.id); setTimeout(() => setFlashId(null), 2800);
    } else if (act === "progress") {
      const g = pick(work), s = Math.max(g.stage, 2);
      patch(g.id, x => ({ ...x, status: "progressing", stage: s, log: [...x.log, { t, w: "System", k: "system", x: `Moved to Stage ${s}: ${STAGES[s - 1]}.` }] }));
      toast(`${g.name} is progressing`);
    } else if (act === "advance") {
      const g = pick(prog);
      patch(g.id, x => ({ ...x, stage: x.stage + 1, log: [...x.log, { t, w: "System", k: "system", x: `Advanced to Stage ${x.stage + 1}: ${STAGES[x.stage]}.` }] }));
      toast(`${g.name} advanced to Stage ${g.stage + 1}`);
    } else if (live.length) {
      const g = pick(live), who = pick(g.students).n.split(" ")[0];
      patch(g.id, x => ({ ...x, log: [...x.log, { t, w: who, k: "student", x: pick(STUDENT_LINES) }] }));
    }
  };
  useEffect(() => {
    if (!sim) return;
    let t; const loop = () => { t = setTimeout(() => { tick(); loop(); }, 4000 + Math.random() * 2000); };
    loop(); return () => clearTimeout(t);
  }, [sim]);
  useEffect(() => {
    const f = e => { if (e.key === "Escape") { if (pop) setPop(false); else if (openId) close(); } };
    window.addEventListener("keydown", f); return () => window.removeEventListener("keydown", f);
  });

  const counts = { all: groups.length };
  ["stuck", "working", "progressing", "verified"].forEach(k => counts[k] = groups.filter(g => g.status === k).length);
  const ql = q.trim().toLowerCase();
  let vis = groups.filter(g => (filter === "all" || g.status === filter) && (!ql || g.name.toLowerCase().includes(ql) || g.students.some(s => s.n.toLowerCase().includes(ql))));
  if (filter === "stuck") vis = [...vis].sort((a, b) => (b.status === "stuck") - (a.status === "stuck"));
  const avg = (groups.reduce((a, g) => a + g.stage, 0) / groups.length).toFixed(1);
  const og = groups.find(g => g.id === openId);
  const tool = "flex min-h-[44px] items-center justify-center gap-2 rounded-xl border border-forest/20 bg-white px-3.5 text-sm font-medium shadow-sm hover:bg-sage/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-forest";

  return (
    <div className="min-h-screen bg-ivory font-sans">
      <header className="sticky top-0 z-30 bg-forest text-white shadow-md">
        <div className="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
          <div className="flex min-w-0 items-center gap-3">
            <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gold text-forest"><Icon name="Sprout" size={20} /></div>
            <h1 className="truncate text-sm font-semibold sm:text-lg">ROOTS Hub <span className="mx-1 text-white/50">|</span><span className="font-medium text-white/90">Teacher Intervention Dashboard</span></h1>
          </div>
          <div className="relative flex shrink-0 items-center gap-3 sm:gap-5">
            <button onClick={() => setPop(p => !p)} aria-expanded={pop} aria-label="Network status" title="Local network mode, no internet"
              className="flex min-h-[44px] items-center gap-1.5 rounded-full bg-white/10 px-3 text-xs hover:bg-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold">
              <Icon name="WifiOff" size={16} className="text-gold" /><span className="hidden sm:inline text-white/90">Local network</span></button>
            <Clock />
            {pop && <><div className="fixed inset-0" onClick={() => setPop(false)} aria-hidden="true" />
              <div className="absolute right-0 top-full z-10 mt-2 w-64 rounded-xl bg-white p-4 text-forest shadow-xl ring-1 ring-forest/10">
                <div className="flex items-start gap-2 text-sm"><Icon name="WifiOff" size={16} className="mt-0.5" /><p>Offline mode: data syncs when connected.</p></div>
                <button onClick={doSync} disabled={syncing} className="mt-3 flex min-h-[44px] w-full items-center justify-center gap-2 rounded-xl bg-forest px-3 text-sm font-semibold text-white hover:bg-forest/90 disabled:opacity-70">
                  <Icon name="RefreshCw" size={16} className={syncing ? "animate-spin" : ""} />{syncing ? "Syncing…" : "Simulate sync"}</button></div></>}
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
        <div className="mb-5 flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
          <div><h2 className="text-xl font-semibold sm:text-2xl">Live Group Activity</h2>
            <p className="text-sm text-forest/75">Lesson: Why do seasons change? · Synced locally, no internet required</p></div>
          <div className="flex flex-wrap gap-2">
            <button onClick={() => setSim(s => !s)} aria-pressed={sim} className={tool}>
              <Icon name={sim ? "Pause" : "Play"} size={16} />Simulate class activity
              <span className={"rounded-full px-2 py-0.5 text-xs " + (sim ? "bg-emerald-100 text-emerald-800" : "bg-gray-200 text-gray-700")}>{sim ? "Live" : "Paused"}</span></button>
            <button onClick={reset} className={tool}><Icon name="RotateCcw" size={16} />Reset demo</button>
          </div>
        </div>

        <div className="mb-5 grid grid-cols-2 gap-3 lg:grid-cols-4">
          {[["Users", "Active groups", groups.length], ["CircleCheck", "Verified", counts.verified], ["TriangleAlert", "Need attention", counts.stuck], ["Layers", "Average stage", avg]].map(([i, l, v]) =>
            <div key={l} className="flex items-center gap-3 rounded-xl border border-forest/10 bg-white px-4 py-3 shadow-sm">
              <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-gold/25"><Icon name={i} size={18} /></div>
              <div><div className="text-lg font-semibold leading-none tabular-nums">{v}</div><div className="mt-1 text-xs text-forest/75">{l}</div></div></div>)}
        </div>

        <div className="mb-6 space-y-3">
          <div className="relative"><Icon name="Search" size={18} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-forest/60" />
            <input value={q} onChange={e => setQ(e.target.value)} aria-label="Search groups or students" placeholder="Search groups or students"
              className="min-h-[44px] w-full rounded-xl border border-forest/20 bg-white pl-10 pr-10 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-forest sm:max-w-sm" />
            {q && <button onClick={() => setQ("")} aria-label="Clear search" className="absolute left-auto right-1 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-lg text-forest sm:right-auto sm:left-[calc(24rem-2.5rem)]"><Icon name="X" size={16} /></button>}</div>
          <div className="flex flex-wrap gap-2" role="group" aria-label="Filter groups">{FILTERS.map(([k, l]) =>
            <button key={k} onClick={() => setFilter(k)} aria-pressed={filter === k}
              className={"flex min-h-[44px] items-center gap-2 rounded-full px-4 text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-forest sm:min-h-[36px] " +
                (filter === k ? "bg-forest text-white shadow-sm" : "border border-forest/20 bg-white hover:bg-sage/60")}>
              {l}<span className={"rounded-full px-1.5 text-xs tabular-nums " + (filter === k ? "bg-white/20" : (k === "stuck" && counts.stuck ? "bg-red-100 text-red-700" : "bg-sage"))}>{counts[k]}</span></button>)}</div>
        </div>

        {vis.length ? <section className="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3">{vis.map(g => <Card key={g.id} g={g} flash={flashId === g.id} onOpen={el => open(g.id, el)} />)}</section> :
          <div className="rounded-xl border border-dashed border-forest/30 bg-white px-6 py-12 text-center">
            <Icon name="Inbox" size={32} className="mx-auto text-forest/60" /><h3 className="mt-3 font-semibold">No groups match</h3>
            <p className="mt-1 text-sm text-forest/75">Try a different search or filter.</p>
            <button onClick={clear} className="mt-4 min-h-[44px] rounded-xl bg-forest px-4 text-sm font-semibold text-white hover:bg-forest/90">Clear filters</button></div>}

        <footer className="mt-10 flex items-center justify-center gap-2 text-xs text-forest/75"><Icon name="HardDrive" size={14} />Data stored on this device · Syncs when connected</footer>
      </main>

      {og && <Drawer g={og} onClose={close} onHint={t => hint(og.id, t)} onResolve={() => resolve(og.id)} onAdvance={() => advance(og.id)} onVerify={() => verify(og.id)} />}

      <div className="pointer-events-none fixed inset-x-4 bottom-4 z-50 flex flex-col items-stretch gap-2 sm:left-auto sm:w-80" style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }} aria-live="polite">
        {toasts.map(t => <div key={t.id} className={"toast-in pointer-events-auto flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium shadow-lg " + (t.type === "alert" ? "bg-red-600 text-white" : "bg-forest text-white")}>
          <Icon name={t.type === "alert" ? "TriangleAlert" : "CircleCheck"} size={16} /><span className="flex-1">{t.msg}</span>
          <button onClick={() => setToasts(x => x.filter(y => y.id !== t.id))} aria-label="Dismiss notification" className="flex h-8 w-8 items-center justify-center rounded-lg hover:bg-white/20"><Icon name="X" size={14} /></button></div>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
